# Render Blueprint — render.yaml
# El repo de GitHub es https://github.com/fdromero30/stamina
# El proyecto vive EN LA RAÍZ del repo (los Dockerfiles están a nivel raíz).
#
# Base de datos: SUPABASE (no Render-managed).
# Las credenciales de Supabase (SPRING_DATASOURCE_URL / USERNAME / PASSWORD)
# están con `sync: false` → se configuran en el dashboard de Render, nunca
# en el repo.

services:
  # ── 1. Backend Java (Spring Boot) ────────────────────────────────
  - type: web
    name: users-config-backend
    env: docker
    plan: free
    rootDir: users-config-backend-java
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # ── Supabase (PostgreSQL) ─────────────────────────────────
      # Se completan desde el panel de Render > Environment.
      # IMPORTANTE: Usa el TRANSACTION POOLER (no el host directo
      # db.<ref>.supabase.co que falla por routing IPv4/IPv6).
      #
      # Valores verificados en DBeaver:
      #   SPRING_DATASOURCE_URL      = jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require
      #   SPRING_DATASOURCE_USERNAME = postgres.ifbrxvkmeiburqagskjs
      #   SPRING_DATASOURCE_PASSWORD = password de Supabase
      #   SPRING_DATASOURCE_DRIVER   = org.postgresql.Driver (auto)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRYPTO_MASTER_KEY
        generateValue: true
      - key: ETORO_MOCK
        value: "false"

  # ── 2. Trading Core (Python/FastAPI) ─────────────────────────────
  - type: web
    name: trading-core
    env: docker
    plan: free
    rootDir: trading-core-python
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Comunicación INTERNA con el backend (HTTP, sin SSL)
      - key: USERS_CONFIG_API_URL
        value: http://users-config-backend.onrender.com
      - key: BOT_API_TOKEN
        generateValue: true

  # ── 3. Frontend (React + Nginx) ──────────────────────────────────
  - type: web
    name: stamina-frontend
    env: docker
    plan: free
    rootDir: frontend-react
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      # RENDER=true es detectado por entrypoint.sh para usar el template
      # de red interna (HTTP directo al servicio, sin handshake SSL).
      - key: RENDER
        value: "true"
      # Comunicación INTERNA entre servicios: HTTP directo al hostname
      # del servicio (evita el 502 Bad Gateway por handshake SSL a la
      # IP pública compartida de Render).
      - key: USERS_CONFIG_API_URL
        value: http://users-config-backend.onrender.com
      - key: TRADING_CORE_API_URL
        value: http://trading-core.onrender.com
