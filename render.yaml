# Render Blueprint — render.yaml
services:
  # ── 1. Backend Java (Spring Boot) ────────────────────────────────
  - type: web
    name: users-config-backend
    env: docker
    plan: free
    rootDir: users-config-backend-java
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Supabase (transaction pooler) — configura en dashboard Render
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRYPTO_MASTER_KEY
        generateValue: true
      - key: ETORO_MOCK
        value: "false"

  # ── 2. Trading Core (Python/FastAPI) ─────────────────────────────
  - type: web
    name: trading-core
    env: docker
    plan: free
    rootDir: trading-core-python
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Hostname interno de Render (sin puerto — Render resuelve el puerto)
      - key: USERS_CONFIG_API_URL
        value: http://users-config-backend
      - key: BOT_API_TOKEN
        generateValue: true

  # ── 3. Frontend (React + Nginx) ──────────────────────────────────
  - type: web
    name: stamina-frontend
    env: docker
    plan: free
    rootDir: frontend-react
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      # Detectado por entrypoint.sh para template de hostname interno
      - key: RENDER
        value: "true"
      # Hostnames internos: Render resuelve el puerto automáticamente
      - key: USERS_CONFIG_API_URL
        value: http://users-config-backend
      - key: TRADING_CORE_API_URL
        value: http://trading-core