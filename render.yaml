# Render Blueprint — render.yaml
# ARQUITECTURA:
# Los 3 servicios son `type: web` (plan free). NO hay red privada
# disponible en free tier → la comunicación entre servicios usa la
# URL pública HTTPS + SNI (proxy_ssl_server_name on en Nginx).
#
#   Navegador → stamina-frontend.onrender.com
#     /api → Nginx → https://users-config-backend.onrender.com (SNI)
#     /trading-core → Nginx → https://trading-core.onrender.com (SNI)

services:
  # ── 1. Backend Java (Spring Boot) ────────────────────────────────
  - type: web
    name: users-config-backend
    env: docker
    plan: free
    rootDir: users-config-backend-java
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Supabase (transaction pooler) — configura en dashboard Render
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRYPTO_MASTER_KEY
        generateValue: true
      - key: ETORO_MOCK
        value: "false"

  # ── 2. Trading Core (Python/FastAPI) ─────────────────────────────
  - type: web
    name: trading-core
    env: docker
    plan: free
    rootDir: trading-core-python
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # HTTPS público del backend (comunicación service-to-service)
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: BOT_API_TOKEN
        generateValue: true

  # ── 3. Frontend (React + Nginx) ──────────────────────────────────
  - type: web
    name: stamina-frontend
    env: docker
    plan: free
    rootDir: frontend-react
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      # Detectado por entrypoint.sh para template con SNI
      - key: RENDER
        value: "true"
      # HTTPS público + SNI (proxy_ssl_server_name on en Nginx)
      # — NO usar http:// ni hostname interno (free tier no tiene red privada)
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: TRADING_CORE_API_URL
        value: https://trading-core.onrender.com