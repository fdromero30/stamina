# Render Blueprint — render.yaml
# El repo de GitHub es https://github.com/fdromero30/stamina
# El proyecto vive EN LA RAÍZ del repo (los Dockerfiles están a nivel raíz).
#
# Base de datos: SUPABASE (no Render-managed).
# Las credenciales de Supabase (SPRING_DATASOURCE_URL / USERNAME / PASSWORD)
# están con `sync: false` → se configuran en el dashboard de Render, nunca
# en el repo.

services:
  # ── 1. Backend Java (Spring Boot) ────────────────────────────────
  - type: web
    name: users-config-backend
    env: docker
    plan: free
    rootDir: users-config-backend-java
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # ── Supabase (PostgreSQL) ─────────────────────────────────
      # Se completan desde el panel de Render > Environment:
      #   SPRING_DATASOURCE_URL      = postgresql://postgres:[PASS]@db.[REF].supabase.co:5432/postgres
      #   SPRING_DATASOURCE_USERNAME = postgres
      #   SPRING_DATASOURCE_PASSWORD = [password de Supabase]
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRYPTO_MASTER_KEY
        generateValue: true
      - key: ETORO_MOCK
        value: "false"

  # ── 2. Trading Core (Python/FastAPI) ─────────────────────────────
  - type: web
    name: trading-core
    env: docker
    plan: free
    rootDir: trading-core-python
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Reemplaza el dominio onrender cuando Render te asigne la URL real
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: BOT_API_TOKEN
        generateValue: true

  # ── 3. Frontend (React + Nginx) ──────────────────────────────────
  - type: web
    name: stamina-frontend
    env: docker
    plan: free
    rootDir: frontend-react
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      # Reemplaza los dominios onrender cuando Render te asigne las URLs reales
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: TRADING_CORE_API_URL
        value: https://trading-core.onrender.com
