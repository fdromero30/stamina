# Render Blueprint — render.yaml
# El repo de GitHub es https://github.com/fdromero30/stamina
# El proyecto real está en la subcarpeta `stamina/` del repo.
#
# Importante: cada rootDir debe apuntar a la carpeta que CONTIENE el Dockerfile.

databases:
  - name: stamina-db
    plan: free

services:
  # ── 1. Backend Java (Spring Boot) ────────────────────────────────
  - type: web
    name: users-config-backend
    env: docker
    plan: free
    rootDir: stamina/users-config-backend-java
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: stamina-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: stamina-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: stamina-db
          property: password
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRYPTO_MASTER_KEY
        generateValue: true
      - key: ETORO_MOCK
        value: "false"

  # ── 2. Trading Core (Python/FastAPI) ─────────────────────────────
  - type: web
    name: trading-core
    env: docker
    plan: free
    rootDir: stamina/trading-core-python
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Reemplaza el dominio onrender cuando Render te asigne la URL real
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: BOT_API_TOKEN
        generateValue: true

  # ── 3. Frontend (React + Nginx) ──────────────────────────────────
  - type: web
    name: stamina-frontend
    env: docker
    plan: free
    rootDir: stamina/frontend-react
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      # Reemplaza los dominios onrender cuando Render te asigne las URLs reales
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: TRADING_CORE_API_URL
        value: https://trading-core.onrender.com