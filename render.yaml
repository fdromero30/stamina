# Render Blueprint — render.yaml
services:
  # ── 1. Backend Java (Spring Boot) ────────────────────────────────
  - type: web
    name: users-config-backend
    env: docker
    plan: free
    rootDir: users-config-backend-java
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Supabase (transaction pooler) — configura en dashboard Render
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CRYPTO_MASTER_KEY
        generateValue: true
      - key: ETORO_MOCK
        value: "false"
      # CORS: permite al navegador del frontend llamar al backend directo
      - key: CORS_ALLOWED_ORIGINS
        value: https://stamina-frontend.onrender.com,http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*

  # ── 2. Trading Core (Python/FastAPI) ─────────────────────────────
  - type: web
    name: trading-core
    env: docker
    plan: free
    rootDir: trading-core-python
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Comunicación directa HTTPS (sin proxy Nginx)
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: BOT_API_TOKEN
        generateValue: true

  # ── 3. Frontend (React + Nginx) ──────────────────────────────────
  - type: web
    name: stamina-frontend
    env: docker
    plan: free
    rootDir: frontend-react
    dockerfilePath: Dockerfile
    healthCheckPath: /
    build:
      dockerBuildArgs:
        # Build-time args: se inyectan durante `npm run build` en Docker
        # para que el bundle JS contenga las URLs absolutas de los backends
        VITE_USERS_CONFIG_API_URL: https://users-config-backend.onrender.com
        VITE_TRADING_CORE_URL: https://trading-core-qthd.onrender.com
    envVars:
      # Detectado por entrypoint.sh para template solo estáticos
      - key: RENDER
        value: "true"
      # Nginx no proxy APIs en Render — el bundle usa URLs absolutas con CORS
      - key: USERS_CONFIG_API_URL
        value: https://users-config-backend.onrender.com
      - key: TRADING_CORE_API_URL
        value: https://trading-core-qthd.onrender.com
