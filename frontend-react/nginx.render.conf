server {
  # Render inyecta la variable PORT
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # rewrite transforma /api/users/login → /users/login
    # (proxy_pass con variable NO hace sustitución de URI)
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass ${USERS_CONFIG_API_URL};
    # HTTPS con SNI y sin verificación de cert (Alpine no tiene CA de Let's Encrypt)
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /trading-core/ {
    rewrite ^/trading-core/(.*)$ /$1 break;
    proxy_pass ${TRADING_CORE_API_URL};
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}