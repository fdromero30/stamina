server {
  # Render inyecta la variable PORT
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # rewrite quita el prefijo /api/ (proxy_pass con variable no lo hace solo)
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass ${USERS_CONFIG_API_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /trading-core/ {
    rewrite ^/trading-core/(.*)$ /$1 break;
    proxy_pass ${TRADING_CORE_API_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}