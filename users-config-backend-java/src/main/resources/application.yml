server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: users-config-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stamina}
    username: ${SPRING_DATASOURCE_USERNAME:stamina}
    password: ${SPRING_DATASOURCE_PASSWORD:stamina_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

crypto:
  master-key: ${CRYPTO_MASTER_KEY:}

etoro:
  api-base-url: ${ETORO_API_BASE_URL:https://public-api.etoro.com/api/v1}
  mock: ${ETORO_MOCK:false}

cors:
  # Comma-separated allowed origins. Override with CORS_ALLOWED_ORIGINS env var.
  # Defaults to localhost for dev when empty.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

