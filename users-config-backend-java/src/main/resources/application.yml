server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: users-config-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # Supabase requires SSL. Credentials are passed separately via env vars.
    # CUIDADO: el '*' en la password rompe el parsing si se embebe en la URL.
    #
    # TRANSACTION POOLER (verificado en DBeaver):
    #   Host: aws-1-us-west-2.pooler.supabase.com
    #   Port: 6543
    # Usuario del pooler = <user>.<project_ref> → postgres.ifbrxvkmeiburqagskjs
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.ifbrxvkmeiburqagskjs}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

crypto:
  master-key: ${CRYPTO_MASTER_KEY:}

etoro:
  api-base-url: ${ETORO_API_BASE_URL:https://public-api.etoro.com/api/v1}
  mock: ${ETORO_MOCK:false}
  # When true (default), trading ops hit the eToro DEMO account. The real
  # routes return 404 RouteNotFound for demo keys.
  demo-mode: ${ETORO_DEMO:true}

cors:
  # Comma-separated allowed origins. Override with CORS_ALLOWED_ORIGINS env var.
  # Defaults to localhost for dev when empty.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

