services:
  proxy:
    # Public entry point. Only this service is exposed to the internet (80/443).
    # Caddy automatically obtains and renews SSL certificates (Let's Encrypt)
    # and redirects HTTP -> HTTPS.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      SCHEME: ${SCHEME:-https}
      DOMAIN: ${DOMAIN:?Set DOMAIN to your domain (e.g. stamina.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for Let's Encrypt certs}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stamina}
      POSTGRES_USER: ${POSTGRES_USER:-stamina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - stamina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stamina} -d ${POSTGRES_DB:-stamina}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports section: database is only reachable inside the Docker network.

  users-config-backend:
    build:
      context: ./users-config-backend-java
    restart: unless-stopped
    environment:
      # ── Supabase (PostgreSQL remoto) ─────────────────────────────
      # Credenciales separadas (nunca embebidas en la URL JDBC — el '*'
      # de la password rompe el parsing de la URL).
      # Supabase exige SSL → ?sslmode=require.
      # Si :5432 da timeout, usa SUPABASE_DB_PORT=6543 (transaction pooler).
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:-5432}/${SUPABASE_DB_NAME:-postgres}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env}
      SERVER_PORT: 8080
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:?Set CRYPTO_MASTER_KEY in .env (openssl rand -hex 32)}
      # Credentials (x-api-key / x-user-key) are resolved per-user from the
      # encrypted api_keys table — never hardcoded here.
      ETORO_API_BASE_URL: ${ETORO_API_BASE_URL:-https://public-api.etoro.com/api/v1}
      # Mocks are DISABLED by default. Enable explicitly with ETORO_MOCK=true
      # only for local development without a real eToro account.
      ETORO_MOCK: ${ETORO_MOCK:-false}
      # CORS: production frontend origin(s) allowed
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    # NOTE: No depende del postgres local — usa Supabase remoto.
    # No ports section: backend is only reachable inside the Docker network.

  trading-core:
    build:
      context: ./trading-core-python
    restart: unless-stopped
    environment:
      USERS_CONFIG_API_URL: http://users-config-backend:8080
      # Protect bot endpoints with a shared token between frontend and trading-core
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
    volumes:
      - stamina_trading_data:/app/data
    depends_on:
      - users-config-backend
    # No ports section: backend is only reachable inside the Docker network.

  frontend:
    build:
      context: ./frontend-react
    restart: unless-stopped
    environment:
      # ── Modo local por defecto: Nginx proxya a backends de la red Docker
      USERS_CONFIG_API_URL: http://users-config-backend:8080
      TRADING_CORE_API_URL: http://trading-core:8000
      # ── Modo "pegarle a producción": el navegador local llama directo a Render
      #    (CORS ya habilitado en el backend de Render).
      #    Activar con USE_PRODUCTION_BACKEND=true en .env
      VITE_USERS_CONFIG_API_URL: ${VITE_USERS_CONFIG_API_URL:-/api}
      VITE_TRADING_CORE_URL: ${VITE_TRADING_CORE_URL:-/trading-core}
    depends_on:
      - trading-core
      - users-config-backend
    # No ports section: only reachable via the proxy service.

volumes:
  stamina_postgres_data:
  stamina_trading_data:
  caddy_data:
  caddy_config: